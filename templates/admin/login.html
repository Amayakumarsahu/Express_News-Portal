<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Mumbai Express</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages.css') }}">
</head>
<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="flash-messages">
        {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    <div class="admin-login-page">
        <div class="admin-login-card">
            <div style="text-align:center;margin-bottom:20px;">
                <div style="width:60px;height:60px;background:linear-gradient(135deg,#E63946,#C1121F);border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:28px;font-weight:900;font-family:'Merriweather',serif;box-shadow:0 4px 15px rgba(230,57,70,.3);">M</div>
            </div>
            <h1>Admin Panel</h1>
            <p class="subtitle">Sign in to manage your news portal</p>

            <form method="POST" action="{{ url_for('admin_login') }}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn-primary">Sign In</button>
            </form>

            <p style="text-align:center;margin-top:20px;font-size:13px;color:#999;">
                <a href="{{ url_for('index') }}" style="color:#0D47A1;">← Back to website</a>
            </p>
        </div>
    </div>

    <script>
    setTimeout(() => {
        document.querySelectorAll('.flash').forEach(el => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); });
    }, 3000);
    </script>
</body>
</html>
