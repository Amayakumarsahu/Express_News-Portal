{% extends "base.html" %}
{% block title %}Subscribe to our Newsletter{% endblock %}
{% block content %}
<div class="main-content">
    <div class="container" style="padding: 60px 0; max-width: 600px; margin: 0 auto;">
        <div style="text-align: center; background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05);">
            <span style="font-size: 48px; display: block; margin-bottom: 20px;">📧</span>
            <h1 style="margin-bottom: 15px;">News24Plus Newsletter</h1>
            <p style="color: #666; margin-bottom: 30px; line-height: 1.6;">
                Get the latest news, top stories, and exclusive content delivered directly to your inbox every morning. Free forever.
            </p>
            <form onsubmit="event.preventDefault(); alert('Thank you for subscribing! Check your inbox for confirmation.'); window.location.href='/';">
                <div class="form-group" style="margin-bottom: 20px;">
                    <input type="text" placeholder="Your Name" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px;" required>
                </div>
                <div class="form-group" style="margin-bottom: 20px;">
                    <input type="email" placeholder="Your Email Address" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px;" required>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; padding: 14px; font-size: 16px;">Subscribe Now</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
